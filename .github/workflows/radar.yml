name: 挂机收益雷达

# 每 3 小时自动跑一轮扫描，把新出现的高价值赏金写入报告并开 Issue 提醒。
# 公开仓库的 GitHub Actions 免费，不消耗你的电脑资源 —— 这就是"挂机"。
on:
  schedule:
    # GitHub 的 cron 是 UTC 时间。
    # 用 7/37 而不是 0/30 —— GitHub 官方建议避开整点，
    # 因为每小时的第 0 分钟是调度最拥挤的时刻，队列中的任务可能被直接丢弃。
    # 频率定为每 4 小时一次：扫描本身要打约 60 次 GitHub API，
    # 触发太密会撞搜索 API 限速（30 次/分钟），反而扫不全。
    # 7/37 UTC = 北京时间 15:37 / 23:37
    - cron: '7,37 */4 * * *'
  workflow_dispatch:
    inputs:
      min_score:
        description: '最低评分（低于此分不报告）'
        required: false
        default: '40'

permissions:
  contents: write   # 提交扫描报告
  issues: write     # 开提醒 Issue

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 必须完整历史：否则 git pull --rebase 会失败，
          # 且 push 会被拒（non-fast-forward，exit code 1）
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 运行雷达扫描
        env:
          # RADAR_TOKEN 是细粒度 PAT，配额 5000 次/小时。
          # 注意：GitHub 禁止密钥名以 GITHUB_ 开头，所以不能命名为 GITHUB_TOKEN。
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN }}
          REPORT_DIR: reports
        run: |
          python3 radar/scan.py

      - name: 归档报告
        uses: actions/upload-artifact@v5
        with:
          name: bounty-report
          path: reports/
          retention-days: 30

      - name: 提交报告到仓库
        env:
          GIT_TOKEN: ${{ secrets.RADAR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 认证：把 token 放进 extraheader，避免明文出现在 remote url / 日志里
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"

          git add reports/

          if git diff --staged --quiet; then
            echo "报告无变化，无需提交"
            exit 0
          fi

          git commit -m "chore: 更新赏金雷达报告 $(date -u +%Y-%m-%d %H:%M)"

          # 关键：远端 main 可能已被其他提交推进（手动上传文件等），
          # 必须先 rebase 再 push，否则被拒报 exit code 1
          git fetch origin main
          git rebase origin/main || {
            echo "rebase 冲突，回退并强制同步"
            git rebase --abort || true
            git reset --hard origin/main
          }
          git push origin HEAD:main

      - name: 生成提醒 Issue
        env:
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN || secrets.GITHUB_TOKEN }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '40' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime

          MIN = float(os.environ.get("MIN_SCORE", "40"))
          d = json.load(open("reports/latest.json", encoding="utf-8"))
          pool = [b for b in d.get("pool", []) if b["analysis"]["score"] >= MIN]
          if not pool:
              print("本轮无达标目标，跳过 Issue 提醒")
              raise SystemExit(0)

          lines = ["# 赏金雷达提醒", "",
                   f"扫描时间：{d['generated_at']}", "",
                   f"本轮达标目标 {len(pool)} 条，按评分排序：", ""]
          for b in pool[:15]:
              a = b["analysis"]
              tb = a.get("time_budget_min")
              lines += [
                  f"### [{b['title']}]({b['url']})",
                  f"- 评分 **{a['score']}** ｜ ${a['amount'] or 0:.0f} ｜ "
                  f"工时 {tb if tb else '?'} 分钟 ｜ `{b['repo']}`",
                  f"- 自动适配度：{a.get('auto_fit')} ｜ 通道：{a['rail']}",
                  f"- 判据：{'；'.join(a['reasons'][:4])}",
                  ""]

          tag = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d-%H")
          title = f"[雷达] {tag} 发现 {len(pool)} 条达标赏金"
          body = "\n".join(lines)

          # 同一小时内已有提醒则跳过，避免刷屏
          exists = subprocess.run(
              ["gh", "issue", "list", "--state", "open", "--limit", "50",
               "--json", "title"],
              capture_output=True, text=True,
              env={**os.environ, "GH_TOKEN": os.environ["GITHUB_TOKEN"]})
          if exists.returncode == 0:
              try:
                  titles = [t.get("title", "") for t in json.loads(exists.stdout or "[]")]
              except Exception:
                  titles = []
              if any(t.startswith(f"[雷达] {tag}") for t in titles):
                  print("同一小时内已有提醒 Issue，跳过")
                  raise SystemExit(0)

          subprocess.run(["gh", "issue", "create", "--title", title, "--body", body],
                         check=True)
          print("已创建提醒 Issue")
          PY
